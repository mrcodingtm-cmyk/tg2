<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Soul Reference</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px; padding-bottom: 80px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        h1 { font-size: 24px; margin-bottom: 8px; text-align: center;
             background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #999; margin-bottom: 16px; text-align: center; font-size: 13px; }
        .search-box { position: sticky; top: 0; background: var(--tg-theme-bg-color, #fff);
                      padding: 8px 0 16px 0; z-index: 10; border-bottom: 1px solid #eee; margin-bottom: 16px; }
        #search { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px;
                  font-size: 15px; transition: all 0.2s; background: #f8f8f8; }
        #search:focus { outline: none; border-color: #667eea; background: #fff; }
        .styles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .style-card { position: relative; border-radius: 16px; overflow: hidden; cursor: pointer;
                      transition: transform 0.2s; background: #f5f5f5; aspect-ratio: 1; }
        .style-card:active { transform: scale(0.95); }
        .style-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .style-overlay { position: absolute; bottom: 0; left: 0; right: 0;
                         background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
                         padding: 12px; color: white; }
        .style-name { font-size: 14px; font-weight: 600; margin-bottom: 2px;
                      text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .style-description { font-size: 11px; opacity: 0.9; line-height: 1.3; max-height: 2.6em;
                             overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .no-results { text-align: center; padding: 40px 20px; color: #999; }
    </style>
</head>
<body>
    <h1>🎨 Soul Reference</h1>
    <p class="subtitle">113 уникальных стилей</p>
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Поиск...">
    </div>
    <div class="styles-grid" id="grid"></div>
    <div class="no-results" id="no-results" style="display: none;">Стили не найдены</div>
    <script src="styles_data.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const grid = document.getElementById('grid');
        const search = document.getElementById('search');
        const noResults = document.getElementById('no-results');
        
        function renderStyles(stylesToShow) {
            grid.innerHTML = '';
            if (stylesToShow.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            stylesToShow.forEach(style => {
                const card = document.createElement('div');
                card.className = 'style-card';
                card.innerHTML = `
                    <img src="${style.preview_url}" alt="${style.name}" loading="lazy">
                    <div class="style-overlay">
                        <div class="style-name">${style.name}</div>
                        ${style.description ? `<div class="style-description">${style.description}</div>` : ''}
                    </div>
                `;
                card.onclick = () => {
                    tg.close();
                    setTimeout(() => {
                        window.location.href = `https://t.me/kling_veo_bot?start=style_${style.id}`;
                    }, 100);
                };
                grid.appendChild(card);
            });
        }
        
        search.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = SOUL_STYLES.filter(s => 
                s.name.toLowerCase().includes(query) ||
                (s.description && s.description.toLowerCase().includes(query))
            );
            renderStyles(filtered);
        });
        
        renderStyles(SOUL_STYLES);
    </script>
</body>
</html>
