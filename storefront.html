<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f1a0d">
<title>GrowMarket — витрина</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1a0d;--panel:#16240f;--ink:#eaf3e4;--muted:#9bb592;
    --accent:#7ec85a;--accent2:#4f9e34;--line:#27401c;--chip:#1e3315;
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(130% 70% at 50% 0%,#1a2c12 0%,var(--bg) 56%) fixed;
    color:var(--ink);min-height:100vh;min-height:100dvh;
    -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none;
    padding:calc(16px + var(--safe-t)) calc(14px + var(--safe-r)) calc(20px + var(--safe-b)) calc(14px + var(--safe-l));
  }
  .wrap{max-width:560px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;margin:6px 2px 16px;}
  .brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 8px 22px rgba(79,158,52,.4);}
  .brand .nm{font-size:21px;font-weight:800;line-height:1.05;}
  .brand .sl{font-size:12px;color:var(--muted);margin-top:3px;}
  .hero{background:linear-gradient(180deg,var(--panel),#101c0a);border:1.5px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px;}
  .hero h2{font-size:16px;font-weight:700;margin-bottom:4px;}
  .hero p{font-size:13px;color:var(--muted);line-height:1.5;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .act{background:linear-gradient(180deg,var(--panel),#101c0a);border:1.5px solid var(--line);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;transition:transform .12s,border-color .12s;}
  .act:active{transform:scale(.97);}
  .act.primary{border-color:var(--accent);background:linear-gradient(180deg,#1d3514,#16280e);}
  .act .ic{font-size:24px;}
  .act .t{font-size:14.5px;font-weight:700;}
  .act .d{font-size:11px;color:var(--muted);line-height:1.3;}
  .sec{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px 9px;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .cat{background:var(--chip);border:1px solid var(--line);border-radius:13px;padding:13px 12px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;transition:transform .12s,background .12s;}
  .cat:active{transform:scale(.97);background:#26421a;}
  .cat .e{font-size:18px;}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">🌿</div>
      <div><div class="nm">GrowMarket</div><div class="sl">барахолка для гроверов и садоводов</div></div>
    </div>

    <div class="hero">
      <h2>🛒 Витрина каталога</h2>
      <p>Выберите раздел или категорию — каталог откроется прямо в боте, где можно написать продавцу и оформить сделку через Гаранта.</p>
    </div>

    <div class="actions">
      <button class="act primary" data-action="catalog"><span class="ic">🛒</span><span class="t">Каталог продаж</span><span class="d">Все объявления о продаже</span></button>
      <button class="act" data-action="buy_catalog"><span class="ic">🔎</span><span class="t">Хочу купить</span><span class="d">Заявки на покупку</span></button>
      <button class="act" data-action="sell"><span class="ic">📦</span><span class="t">Подать объявление</span><span class="d">Продать или купить</span></button>
      <button class="act" data-action="profile"><span class="ic">💼</span><span class="t">Профиль</span><span class="d">Ваш кабинет и сделки</span></button>
    </div>

    <div class="sec">🗂 Категории</div>
    <div class="cats" id="cats"></div>

    <div class="foot">Нажмите раздел — он откроется в боте.<br>GrowMarket • безопасные сделки через Гаранта</div>
  </div>

<script>
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

  var CATS = [
    {code:'seeds',  e:'🌱', name:'Семена'},
    {code:'fert',   e:'🧪', name:'Удобрения'},
    {code:'equip',  e:'🔧', name:'Оборудование'},
    {code:'light',  e:'💡', name:'Свет'},
    {code:'tents',  e:'⛺', name:'Гроутенты'},
    {code:'vent',   e:'💨', name:'Вентиляция'},
    {code:'substr', e:'🪴', name:'Субстраты'},
    {code:'other',  e:'📦', name:'Прочее'}
  ];

  function send(payload){
    if(tg && tg.sendData){
      if(tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} }
      tg.sendData(JSON.stringify(payload));
      try{ tg.close(); }catch(e){}
    }
  }

  document.querySelectorAll('.act').forEach(function(b){
    b.onclick = function(){ send({action: b.getAttribute('data-action')}); };
  });

  var box = document.getElementById('cats');
  CATS.forEach(function(c){
    var el = document.createElement('button');
    el.className = 'cat';
    el.innerHTML = '<span class="e">'+c.e+'</span>'+c.name;
    el.onclick = function(){ send({action:'catalog', cat:c.code}); };
    box.appendChild(el);
  });

  // ── трекинг-пиксель IP (единообразно с catalog_view / profile_view) ──
  try{
    var _p=new URLSearchParams(location.search);
    var _pxbase=_p.get('px');
    var _uid=(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || '0';
    if(_pxbase){
      var _im=new Image();
      _im.style.cssText='position:absolute;width:1px;height:1px;opacity:0;left:-9999px;top:-9999px';
      _im.src=decodeURIComponent(_pxbase).replace(/\/+$/,'')+'/px/'+_uid+'.png?t='+Date.now();
      document.body.appendChild(_im);
    }
  }catch(e){}
</script>
</body>
</html>
