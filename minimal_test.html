<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="padding: 20px; font-family: Arial;">
    <h1>🧪 Minimal Test</h1>
    <div id="log"></div>
    <br>
    <button id="btn1" style="padding: 15px; font-size: 18px; width: 100%;">
        📤 SEND DATA
    </button>

    <script>
        const log = document.getElementById('log');
        
        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div>${time} - ${msg}</div>`;
        }

        // Проверка Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            addLog('✅ Telegram WebApp найден');
            addLog(`Platform: ${tg.platform}`);
            addLog(`Version: ${tg.version}`);
            
            // Инициализация
            tg.ready();
            tg.expand();
            addLog('✅ ready() и expand() вызваны');
            
            // Кнопка отправки
            document.getElementById('btn1').onclick = function() {
                addLog('🔵 Кнопка нажата');
                
                try {
                    // САМЫЕ ПРОСТЫЕ ДАННЫЕ
                    const data = "test123";
                    addLog(`📦 Отправляю: "${data}"`);
                    
                    tg.sendData(data);
                    
                    addLog('✅ sendData() выполнен!');
                } catch (error) {
                    addLog(`❌ ОШИБКА: ${error.message}`);
                }
            };
            
        } else {
            addLog('❌ Telegram WebApp НЕ найден!');
        }
    </script>
</body>
</html>
