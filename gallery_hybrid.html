<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Soul Styles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        
        h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #999; margin-bottom: 20px; text-align: center; font-size: 13px; }
        
        .styles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .style-card {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .style-card:active { transform: scale(0.95); }
        
        .style-icon { font-size: 36px; margin-bottom: 8px; }
        .style-name { font-size: 14px; font-weight: 600; }
        .style-id { font-size: 11px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>🎨 Soul Styles</h1>
    <p class="subtitle">Выберите стиль - откроется кнопка подтверждения</p>
    
    <div class="styles-grid" id="grid"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const styles = [
            {id: 'realistic_001', name: 'Realistic', icon: '📸'},
            {id: 'anime_001', name: 'Anime', icon: '🎌'},
            {id: 'digital_art_001', name: 'Digital Art', icon: '🖼️'},
            {id: 'oil_painting_001', name: 'Oil Painting', icon: '🎨'},
            {id: 'watercolor_001', name: 'Watercolor', icon: '💧'},
            {id: 'sketch_001', name: 'Sketch', icon: '✏️'},
            {id: '3d_render_001', name: '3D Render', icon: '🎲'},
            {id: 'pixel_art_001', name: 'Pixel Art', icon: '👾'},
            {id: 'fantasy_001', name: 'Fantasy', icon: '🧙'},
            {id: 'cyberpunk_001', name: 'Cyberpunk', icon: '🌆'},
        ];
        
        const grid = document.getElementById('grid');
        
        styles.forEach(style => {
            const card = document.createElement('div');
            card.className = 'style-card';
            card.innerHTML = `
                <div class="style-icon">${style.icon}</div>
                <div class="style-name">${style.name}</div>
                <div class="style-id">${style.id}</div>
            `;
            
            card.onclick = () => {
                // Открываем deep link - это ГАРАНТИРОВАННО работает!
                const botUsername = 'kling_veo_bot';
                const startParam = `style_${style.id}`;
                
                // Закрываем WebApp и открываем чат с параметром
                tg.close();
                
                // Открываем бота с параметром
                setTimeout(() => {
                    window.location.href = `https://t.me/${botUsername}?start=${startParam}`;
                }, 100);
            };
            
            grid.appendChild(card);
        });
    </script>
</body>
</html>
